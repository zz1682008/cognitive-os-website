# Include inside the existing twww.linzhaozhao.com HTTPS server only.
# Replace its old Website proxy location. Preserve listen/TLS/ACME and peer hosts.
# Each immutable release contains only dist/client/ from the reviewed build.
root /opt/massos/website/current/dist/client;
index index.html;
autoindex off;
add_header Cache-Control "no-cache";

location = / {
    try_files /index.html =404;
}

location = /auth/callback {
    try_files /auth/callback.html =404;
}

location = /auth/callback/ {
    try_files /auth/callback.html =404;
}

location = /personal {
    return 308 /personal/$is_args$args;
}

location = /personal/ {
    try_files /personal/index.html =404;
}

# Vinext requests the root Flight payload as /.rsc.
location = /.rsc {
    types { }
    default_type text/x-component;
    try_files /index.rsc =404;
}

# The sole hidden-path exception is the exact root RSC location above.
# Preserve the existing dedicated ACME location in the surrounding server.
location ~ /\. {
    return 404;
}

location ~* ^/(?:dist|server|node_modules|__vinext)(?:/|$) {
    return 404;
}

location ~ \.rsc$ {
    types { }
    default_type text/x-component;
    try_files $uri =404;
}

# Unknown paths return 404; authentication/API paths never fall back to Home.
location / {
    try_files $uri =404;
}
